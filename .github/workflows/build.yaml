name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Manual, on-demand builds — e.g. testing a pre-release OpenClaw version or
  # the experimental Containerfile.hi (Red Hat Hardened Images) base. Always
  # pushed (so it's pullable from GHCR) but tagged distinctly and NEVER
  # promoted to `latest` — see the "promote" job's condition below.
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "OpenClaw npm version to build (blank = use package.json's pinned version)"
        required: false
        default: ""
      containerfile:
        description: "Which Containerfile to build"
        required: false
        type: choice
        default: "Containerfile"
        options:
          - "Containerfile"
          - "Containerfile.hi"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node.js 24 for all actions now — becomes the default in June 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Build, boot-test, and push (push/promote skipped on PRs)
  # ---------------------------------------------------------------------------
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for SBOM / provenance attestation.
      id-token: write

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Single source of truth for the OpenClaw version: package.json exists
      # only so Dependabot can open a PR bumping it. Nothing here ever runs
      # `npm install` against it. A manual workflow_dispatch run can
      # override it to test a specific (e.g. pre-release) version instead.
      - name: Resolve OpenClaw version and Containerfile
        run: |
          VERSION="${{ inputs.openclaw_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(jq -r .dependencies.openclaw package.json)"
          fi
          echo "OPENCLAW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CONTAINERFILE=${{ inputs.containerfile || 'Containerfile' }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only authenticate when we will actually push (not on PRs from forks).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semantic version tag from git tag (e.g. v2026.4.2 → 2026.4.2)
            type=semver,pattern={{version}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'workflow_dispatch' }}
            # openclaw upstream version embedded in every image
            type=raw,value=${{ env.OPENCLAW_VERSION }},enable=${{ github.event_name != 'workflow_dispatch' }}
            # Short SHA for traceability
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'workflow_dispatch' }}
            # Manual/experimental builds get their own clearly-labeled tag
            # instead — never mixed into the version/semver tag namespace.
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}
          # NOTE: no `latest` tag here on purpose. `latest` only gets moved
          # by the separate "promote" job below, and only after this image
          # boots cleanly and Trivy comes back clean — so `latest` always
          # points at a known-good image. Manual builds never reach that
          # job at all (see its `if:` condition).
          labels: |
            org.opencontainers.image.title=OpenClaw
            org.opencontainers.image.description=OpenClaw autonomous AI agent on UBI 10 + Node.js 24
            org.opencontainers.image.vendor=shiftclaw
            org.opencontainers.image.licenses=MIT

      # PRs build a single-platform image loaded into the local Docker
      # daemon (never pushed) so it can still be boot-tested below. Pushes
      # build the real multi-platform image and push everything except
      # `latest`.
      - name: Build (and push except `latest`)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.CONTAINERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCLAW_VERSION=${{ env.OPENCLAW_VERSION }}
          # Multi-platform only when pushing — `load` only supports a single
          # platform, and PRs never need arm64 to prove the image boots.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # GitHub Actions layer cache — dramatically speeds up repeat builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Generate SBOM and provenance attestation for supply-chain security.
          # (Only meaningful — and only supported by build-push-action — on
          # a real push, not a local --load build.)
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Boots the image with no config/volume — the same "brand new install"
      # path a first-time user hits — and fails the job if it doesn't reach
      # "[gateway] ready" quickly. Catches a broken base image or a runtime
      # that can't satisfy OpenClaw's own startup requirements before
      # either one ever reaches `latest`.
      - name: Smoke-test image boot
        env:
          IMAGE_TO_TEST: >-
            ${{ github.event_name == 'pull_request'
                && fromJSON(steps.meta.outputs.json).tags[0]
                || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build-push.outputs.digest) }}
        run: |
          set -euo pipefail
          echo "Testing: $IMAGE_TO_TEST"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull "$IMAGE_TO_TEST"
          fi
          docker run -d --name smoke-test \
            --env OPENCLAW_GATEWAY_TOKEN=ci-smoke-test-token \
            "$IMAGE_TO_TEST"

          ready=0
          for _ in $(seq 1 30); do
            if docker logs smoke-test 2>&1 | grep -q '\[gateway\] ready'; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
              echo "::error::Container exited before reaching ready (exit code $(docker inspect -f '{{.State.ExitCode}}' smoke-test))"
              break
            fi
            sleep 2
          done

          echo "--- container logs ---"
          docker logs smoke-test 2>&1
          docker rm -f smoke-test >/dev/null 2>&1 || true

          if [ "$ready" != "1" ]; then
            echo "::error::Image never printed '[gateway] ready' within 60s"
            exit 1
          fi
          echo "Smoke test passed: gateway reached ready."

  # ---------------------------------------------------------------------------
  # Security scan — runs on main branch and tag pushes only (not on PRs,
  # because the image is not pushed to GHCR for pull requests).
  # ---------------------------------------------------------------------------
  scan:
    name: Trivy CVE scan
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout (for .trivyignore if present)
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build.outputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: Fail on CRITICAL CVEs only
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL \
            ${{ needs.build.outputs.image-ref }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # Promote to `latest`. Only runs once the image has booted cleanly
  # (build job's smoke test) and passed the CVE gate (scan), and only for
  # pushes to main (never PRs, never tag releases).
  # ---------------------------------------------------------------------------
  promote:
    name: Promote to latest
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the already-built manifest as latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ needs.build.outputs.image-ref }}
